name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest -q

      - name: Avaliacao das regras (smoke test)
        run: python -m agentwatch.evaluate > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t agentwatch:ci .

      - name: Smoke test da API
        run: |
          docker run -d --name aw-api -p 8000:8000 -e AGENTWATCH_SEED_ON_START=1 agentwatch:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/stats \
            | python3 -c "import sys, json; s = json.load(sys.stdin); assert s['events'] > 0, s"

      - name: Smoke test do painel
        run: |
          docker run -d --name aw-dash -p 8501:8501 -e AGENTWATCH_SERVICE=dashboard agentwatch:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker logs aw-api || true
          docker logs aw-dash || true
